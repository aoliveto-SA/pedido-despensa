<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Gestión para Pedidos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --verde:#16a34a;--verde-claro:#dcfce7;--verde-txt:#166534;
  --azul:#367fc2;--azul-claro:#e8f2fa;--azul-txt:#1d4f78;
  --rojo:#dc2626;--amarillo:#fef9c3;--amarillo-txt:#854d0e;
  --borde:#e5e7eb;--fondo:#f9fafb;--blanco:#fff;--gris:#6b7280;
  --texto:#111827;--radio:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:var(--texto);background:#f3f4f6;min-height:100vh}
.header{background:var(--azul);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
.header h1{font-size:16px;font-weight:600}
.header p{font-size:12px;opacity:.8;margin-top:2px}
.container{max-width:960px;margin:0 auto;padding:16px}
/* Tabs */
.tabs{display:flex;gap:0;background:var(--blanco);border-radius:var(--radio);overflow:hidden;border:1px solid var(--borde);margin-bottom:16px}
.tab{flex:1;padding:10px 8px;cursor:pointer;border:none;background:none;color:var(--gris);font-size:12px;font-family:inherit;font-weight:500;border-bottom:2px solid transparent;transition:.15s}
.tab.on{color:var(--azul);border-bottom-color:var(--azul);background:var(--azul-claro)}
.sec{display:none}.sec.on{display:block}
/* Cards */
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
/* Macro panel */
.macro-card{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1px solid #bfdbfe;border-radius:var(--radio);padding:16px;margin-bottom:12px}
.macro-card .card-title{color:var(--azul-txt)}
.macro-preview{margin-top:8px;background:var(--blanco);border:1px solid #bfdbfe;border-radius:6px;max-height:180px;overflow-y:auto}
.mi{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid #f0f9ff;font-size:12px}
.mi:last-child{border-bottom:none}
/* Forms */
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
.form-col{display:flex;flex-direction:column;gap:3px}
.form-col.grow{flex:1}
label{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
select,input[type=text],input[type=number]{padding:7px 9px;font-size:13px;border:1px solid var(--borde);border-radius:6px;background:var(--blanco);color:var(--texto);font-family:inherit;width:100%}
select:focus,input:focus{outline:2px solid var(--azul);border-color:transparent}
/* Buttons */
.btn{padding:7px 14px;font-size:13px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500;border:none;transition:.15s}
.btn-a{background:var(--azul);color:#fff}.btn-a:hover{background:#2c689f}
.btn-g{background:var(--verde);color:#fff}.btn-g:hover{background:#15803d}
.btn-s{background:none;border:1px solid var(--borde);color:var(--texto)}.btn-s:hover{background:var(--fondo)}
.btn-w{width:100%;padding:10px;font-size:14px;background:var(--azul);color:#fff;border:none;border-radius:var(--radio);cursor:pointer;font-weight:600;margin-top:8px}
/* Pills */
.pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.pill-pp{background:var(--azul-claro);color:var(--azul-txt)}
.pill-gu{background:var(--verde-claro);color:var(--verde-txt)}
.pill-en{background:var(--amarillo);color:var(--amarillo-txt)}
.pill-so{background:#ede9fe;color:#5b21b6}
.pill-po{background:#fce7f3;color:#9d174d}
.pill-ot{background:var(--fondo);color:var(--gris)}
.dtag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--azul-claro);color:var(--azul-txt);font-weight:500;white-space:nowrap}
/* Item list */
.ilist{border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;margin-bottom:10px}
.irow{display:grid;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--borde)}
.irow:last-child{border-bottom:none}.irow:hover{background:var(--fondo)}
.porinp{width:58px;padding:5px 6px;font-size:12px;text-align:center;border:1px solid var(--borde);border-radius:4px;background:var(--blanco)}
.del{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1;padding:2px 4px}.del:hover{color:var(--rojo)}
.empty{color:var(--gris);text-align:center;padding:24px;font-size:13px;background:var(--blanco);border:1px dashed var(--borde);border-radius:var(--radio)}

.dia-acc{border:1px solid var(--borde);border-radius:var(--radio);margin-bottom:8px;overflow:hidden;background:var(--blanco)}
.dia-acc-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:var(--fondo);font-size:13px;font-weight:600;user-select:none}
.dia-acc-hdr:hover{background:var(--azul-claro)}
.dia-acc-arrow{display:inline-block;transition:transform .15s;color:var(--gris);font-size:10px}
.dia-acc-body{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--borde)}
.dia-acc-col{padding:10px 12px;min-width:0}
.dia-acc-col:first-child{border-right:1px solid var(--borde)}
.dia-acc-col-hdr{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--borde)}
.mrow:last-child{border-bottom:none}
.mrow-main{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer}
.mrow-nombre{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow-detalle{padding:0 0 8px 0}
.mrow .porinp{width:52px !important;flex:0 0 52px}
.mrow .del{flex:0 0 auto}
.rec-detalle{padding:8px 12px 12px;background:var(--fondo);border-bottom:1px solid var(--borde)}
.rec-ing-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px;border-bottom:1px solid #e5e7eb}
.rec-ing-row:last-of-type{border-bottom:none}
.rec-ing-cant{color:var(--azul-txt);font-weight:600;white-space:nowrap}
@media (max-width:640px){
  .dia-acc-body{grid-template-columns:1fr}
  .dia-acc-col:first-child{border-right:none;border-bottom:1px solid var(--borde)}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;white-space:nowrap;padding:10px 12px}
  .ilist{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .container{padding:12px}
  .header{padding:12px 14px}
}
/* Search dropdown */
.srch{position:relative}
.drop{position:absolute;top:100%;left:0;right:0;background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);z-index:200;max-height:200px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.drop.vis{display:block}
.dopt{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--borde);font-size:13px}
.dopt:last-child{border-bottom:none}.dopt:hover{background:var(--fondo)}
.dopt small{color:var(--gris);font-size:11px;margin-left:4px}
/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:4px 12px;border-radius:12px;cursor:pointer;border:1px solid var(--borde);background:none;color:var(--gris);font-family:inherit;font-weight:500}
.chip.on{background:var(--azul-claro);color:var(--azul-txt);border-color:#93c5fd}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--gris);text-align:left;padding:8px 10px;border-bottom:1px solid var(--borde);text-transform:uppercase;letter-spacing:.04em;font-weight:600;background:var(--fondo)}
td{padding:8px 10px;border-bottom:1px solid var(--borde)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--fondo)}
.num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.num-dim{text-align:right;color:var(--gris);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px}
.b-g{background:var(--verde-claro);color:var(--verde-txt)}
.b-ml{background:var(--azul-claro);color:var(--azul-txt)}
.b-u{background:var(--amarillo);color:var(--amarillo-txt)}
.b-o{background:var(--fondo);color:var(--gris)}
/* Summary cards */
.sums{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.scard{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:12px 16px;flex:1;min-width:80px;text-align:center}
.scard strong{display:block;font-size:24px;font-weight:700;color:var(--azul)}
.scard span{font-size:11px;color:var(--gris);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
/* Notif */
.notif{border-radius:var(--radio);padding:10px 14px;font-size:12px;margin-bottom:10px;display:none;font-weight:500}
.notif.show{display:block}
/* Plantilla */
.plantilla-card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.pc-name{flex:1}
.pc-name strong{font-size:13px;font-weight:600;display:block}
.pc-name small{font-size:11px;color:var(--gris)}
/* Prov badge */
.prov-badge{font-size:10px;padding:1px 7px;border-radius:8px;background:#fef3c7;color:#92400e;margin-left:6px;font-weight:500}
.prov-badge.p{background:#fee2e2;color:#991b1b}
/* Dia section */
.dia-sec{margin-bottom:20px}
.dia-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);padding:6px 0;margin-bottom:8px;border-bottom:2px solid var(--borde)}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* Control de acceso admin */
.sa-badge{font-size:11px;padding:6px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sa-badge b{font-weight:600}
.sa-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:1000;align-items:center;justify-content:center;padding:16px}
.sa-modal{background:#fff;border-radius:12px;padding:22px 20px;max-width:320px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sa-modal h3{font-size:15px;margin-bottom:4px;color:var(--texto)}
.sa-modal p{font-size:12px;color:var(--gris);margin-bottom:14px}
.sa-modal input{width:100%;padding:10px 12px;font-size:16px;letter-spacing:2px;text-align:center;border:1px solid var(--borde);border-radius:8px;margin-bottom:10px}
.sa-modal .sa-err{display:none;color:var(--rojo);font-size:12px;margin:-4px 0 10px}
.sa-modal-btns{display:flex;gap:8px}
.sa-modal-btns button{flex:1;padding:9px;font-size:13px;border-radius:8px;border:1px solid var(--borde);background:var(--blanco);cursor:pointer;font-family:inherit}
.sa-modal-btns button.sa-primary{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}

/* ─── Navegador de días ─── */
.dia-nav{display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);align-items:center}
.dia-nav.vis{display:flex}
.dia-nav-label{font-size:11px;color:var(--gris);font-weight:600;white-space:nowrap;margin-right:4px}
.dia-nav-btn{font-size:12px;padding:5px 11px;border-radius:10px;cursor:pointer;
  border:1px solid var(--borde);background:none;color:var(--gris);font-family:inherit;
  font-weight:500;white-space:nowrap;transition:.15s}
.dia-nav-btn:hover{background:var(--azul-claro);color:var(--azul-txt);border-color:#93c5fd}
.dia-nav-btn.activo{background:var(--azul);color:#fff;border-color:var(--azul)}

/* ─── Navegador rápido de días (vista Por día) ─── */
.dia-nav{display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);align-items:center}
.dia-nav.vis{display:flex}
.dia-nav-label{font-size:11px;color:var(--gris);font-weight:600;white-space:nowrap;margin-right:4px}
.dia-nav-btn{font-size:12px;padding:5px 12px;border-radius:10px;cursor:pointer;
  border:1px solid var(--borde);background:none;color:var(--gris);font-family:inherit;
  font-weight:500;white-space:nowrap;transition:.15s}
.dia-nav-btn:hover{background:var(--azul-claro);color:var(--azul-txt);border-color:#93c5fd}
.dia-nav-btn.activo{background:var(--azul);color:#fff;border-color:var(--azul)}
</style>
</head>
